name: Refresh league data

on:
  schedule:
    # times are UTC. Every 30 min across NBA game windows (~7pm-2:30am ET)...
    - cron: "*/30 23 * * *"
    - cron: "*/30 0-6 * * *"
    # ...plus daytime runs for injury news and lineup changes
    - cron: "0 12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # past seasons' tidy tables + coaching solves don't change; keep them between runs
      - uses: actions/cache@v4
        with:
          path: data/tidy
          key: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'requirements.txt') }}-

      - name: Fetch from ESPN and build analytics
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON || '2027' }}
        run: python pipeline/build.py --fetch

      - name: Commit refreshed data
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history site/data config
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
