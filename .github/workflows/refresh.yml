name: Refresh league data

on:
  schedule:
    # times are UTC. Off-peak minutes on purpose: GitHub delays or drops runs scheduled at :00/:30.
    # Every 10 min from ~4pm ET (when teams post injury reports and betting lines move) through the
    # game window (~2:30am ET)...
    - cron: "3,13,23,33,43,53 21-23 * * *"
    - cron: "3,13,23,33,43,53 0-6 * * *"
    # ...plus daytime runs for injury news and lineup changes
    - cron: "17 12,15,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # past seasons' tidy tables + coaching solves don't change; keep them between runs
      - uses: actions/cache@v6
        with:
          path: data/tidy
          key: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'pipeline/expected.py', 'pipeline/projections.py', 'pipeline/simulate.py', 'pipeline/season_sim.py', 'pipeline/injuries.py', 'pipeline/usage.py', 'pipeline/model_params.json', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'pipeline/expected.py', 'pipeline/projections.py', 'pipeline/simulate.py', 'pipeline/season_sim.py', 'pipeline/injuries.py', 'pipeline/usage.py', 'pipeline/model_params.json', 'requirements.txt') }}-

      - name: Fetch from ESPN and build analytics
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON || '2027' }}
        run: python pipeline/build.py --fetch

      - name: Commit refreshed data
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history site/data site/img site/index.html config
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          # someone else may have pushed meanwhile; replay this refresh on top (its data wins)
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # GitHub sometimes can't see a just-uploaded artifact for a few seconds ("No artifacts named
      # github-pages"): try again after a short wait instead of failing the whole refresh
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
