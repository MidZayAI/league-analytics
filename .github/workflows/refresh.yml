name: Refresh league data

on:
  schedule:
    # times are UTC. Off-peak minutes on purpose: GitHub delays or drops runs scheduled at :00/:30.
    # Every 10 min across NBA game windows (~7pm-2:30am ET)...
    - cron: "3,13,23,33,43,53 23 * * *"
    - cron: "3,13,23,33,43,53 0-6 * * *"
    # ...plus daytime runs for injury news and lineup changes
    - cron: "17 12,15,18,21 * * *"
  workflow_dispatch:
  # a podcast episode uploaded through GitHub goes live right away
  push:
    paths: ["site/podcast/episodes/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # past seasons' tidy tables + coaching solves don't change; keep them between runs
      - uses: actions/cache@v4
        with:
          path: data/tidy
          key: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'pipeline/expected.py', 'pipeline/projections.py', 'pipeline/simulate.py', 'pipeline/season_sim.py', 'pipeline/injuries.py', 'pipeline/usage.py', 'pipeline/model_params.json', 'requirements.txt') }}-${{ github.run_id }}
          restore-keys: tidy-${{ hashFiles('pipeline/normalize.py', 'pipeline/coaching.py', 'pipeline/expected.py', 'pipeline/projections.py', 'pipeline/simulate.py', 'pipeline/season_sim.py', 'pipeline/injuries.py', 'pipeline/usage.py', 'pipeline/model_params.json', 'requirements.txt') }}-

      # podcast uploads that aren't mp3 yet (or new episodes needing a duration) need ffmpeg
      - name: Install ffmpeg if a new podcast episode needs it
        run: |
          for f in site/podcast/episodes/*; do
            case "$f" in *.mp3) [ -e "${f%.mp3}.json" ] && continue ;; *.json|*'*') continue ;; esac
            sudo apt-get install -y -qq ffmpeg > /dev/null && break
          done

      - name: Fetch from ESPN and build analytics
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          SEASON: ${{ vars.SEASON || '2027' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build.py --fetch

      - name: Commit refreshed data
        run: |
          git config user.name "league-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/history site/data site/img site/podcast site/index.html config
          git diff --cached --quiet || git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          # someone else may have pushed meanwhile; replay this refresh on top (its data wins)
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 5
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
